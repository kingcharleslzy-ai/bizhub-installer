schema_version: bizhub.public_bootstrap.v1
status: implementation_preview

repository:
  id: github://kingcharleslzy-ai/bizhub-installer
  url: https://github.com/kingcharleslzy-ai/bizhub-installer
  release_tag: v0.4.0-preview.1
  checksums_path: install/CHECKSUMS.sha256

delivery:
  installer_path: bizhubctl
  application_path: app
  plugin_path: plugins/bizhub-core
  mcp_server_id: bizhub-mcp
  mcp_config_path: plugins/bizhub-core/.mcp.json
  bootstrap_skill_id: bizhub-bootstrap
  bootstrap_skill_path: plugins/bizhub-core/skills/bizhub-bootstrap
  customer_extension_guide: docs/customer-skill-extension.md

agent_host_setup:
  marketplace_source: kingcharleslzy-ai/bizhub-installer
  marketplace_name: bizhub-public
  plugin_selector: bizhub-core@bizhub-public
  required_ref: verified_40_character_release_commit
  required_readback:
    - exactly_one_enabled_bizhub_core
    - exactly_one_bizhub_bootstrap_skill
    - exactly_one_bizhub_mcp
  start_new_task_after_install: true

supported_target:
  os: Ubuntu 24.04
  runtime: Docker Engine
  database: SQLite
  tenancy: one_company_one_instance
  administrator_accounts: 1

capabilities:
  production_backend: true
  production_frontend: true
  preview_apply_readback: true
  csv_json_import: true
  backup_restore: true
  arbitrary_shell_via_mcp: false
  arbitrary_url_via_mcp: false
  database_direct_write: false
  host_mutation_without_plan_approval: false

release_gates:
  - verify_repository_tag_commit_and_checksums
  - run_target_preflight
  - approve_exact_plan_hash
  - verify_install_and_final_access
  - verify_backup_and_restore_before_customer_data

first_question_stage: deployment
