name: Desktop D3 Windows x64

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Use production only after repository signing secrets are configured.
        required: true
        type: choice
        default: synthetic-ci
        options:
          - synthetic-ci
          - production
  push:
    branches:
      - codex/desktop-d3-windows-x64
      - codex/desktop-l1-unified-local-20260827
      - generic/customer-cobuild-pack-a-desktop-20260901
      - generic/customer-cobuild-pack-b-desktop-20260902

permissions:
  contents: write

concurrency:
  group: desktop-d3-windows-x64
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Preserve repository byte identity on Windows
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.10

      - name: Verify fixed Windows runner architecture
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "desktop_d3_runner_architecture_invalid"
          }
          if ((node -p "process.platform") -ne "win32" -or (node -p "process.arch") -ne "x64") {
            throw "desktop_d3_node_target_invalid"
          }
          if ((python -c "import platform; print(platform.machine().lower())") -notin "amd64", "x86_64") {
            throw "desktop_d3_python_target_invalid"
          }

      - name: Install hash-locked Windows Runtime build environment
        shell: pwsh
        run: |
          $runtimePython = Join-Path $env:RUNNER_TEMP "bizhub-runtime-venv\Scripts\python.exe"
          python -m venv (Split-Path -Parent (Split-Path -Parent $runtimePython))
          & $runtimePython -m pip install --disable-pip-version-check --require-hashes -r runtime/requirements-build.windows-x64.lock
          "BIZHUB_RUNTIME_PYTHON=$runtimePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify fixed source checksums
        run: python ../scripts/verify_checksums.py

      - name: Verify read-only Windows parent-process probe
        shell: pwsh
        run: |
          & $env:BIZHUB_RUNTIME_PYTHON -c "import os,sys; sys.path.insert(0, 'runtime'); import bizhub_runtime_entry_windows as entry; assert entry._parent_process_alive(os.getpid())"

      - name: Prove two Windows Runtime builds are deterministic
        id: runtime
        shell: pwsh
        run: |
          function Read-RuntimeIdentity {
            $manifestPath = "runtime-dist\bizhub-runtime\runtime-release-manifest.json"
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            return [ordered]@{
              manifest_sha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
              pack_tree_digest = $manifest.pack_tree_digest
              file_count = $manifest.files.Count
              source_tree_digest = $manifest.runtime_source_tree_digest
            }
          }
          & $env:BIZHUB_RUNTIME_PYTHON runtime/build_windows_runtime.py --python $env:BIZHUB_RUNTIME_PYTHON
          $first = Read-RuntimeIdentity
          Copy-Item -LiteralPath "runtime-dist\bizhub-runtime\runtime-release-manifest.json" `
            -Destination (Join-Path $env:RUNNER_TEMP "bizhub-first-runtime-manifest.json")
          & $env:BIZHUB_RUNTIME_PYTHON runtime/build_windows_runtime.py --python $env:BIZHUB_RUNTIME_PYTHON
          $second = Read-RuntimeIdentity
          $firstJson = $first | ConvertTo-Json -Compress
          $secondJson = $second | ConvertTo-Json -Compress
          Write-Output "first_runtime_identity=$firstJson"
          Write-Output "second_runtime_identity=$secondJson"
          if ($firstJson -ne $secondJson) {
            $firstManifest = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "bizhub-first-runtime-manifest.json") -Raw | ConvertFrom-Json
            $secondManifest = Get-Content -LiteralPath "runtime-dist\bizhub-runtime\runtime-release-manifest.json" -Raw | ConvertFrom-Json
            $firstFiles = @{}
            foreach ($record in $firstManifest.files) { $firstFiles[$record.path] = $record }
            $differences = foreach ($record in $secondManifest.files) {
              $before = $firstFiles[$record.path]
              if (-not $before -or $before.sha256 -ne $record.sha256 -or $before.size -ne $record.size) {
                "$($record.path):$($before.sha256):$($record.sha256):$($before.size):$($record.size)"
              }
            }
            $differenceText = $differences -join ","
            Write-Output "::error title=Windows Runtime nondeterminism::first=$firstJson second=$secondJson differing_files=$differenceText"
            throw "desktop_windows_runtime_build_not_deterministic"
          }
          $second | ConvertTo-Json -Compress
          "manifest_sha256=$($second.manifest_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pack_tree_digest=$($second.pack_tree_digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file_count=$($second.file_count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_tree_digest=$($second.source_tree_digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Capture the Windows Runtime when source identity changes
        id: capture
        shell: pwsh
        run: |
          $archive = "runtime/vendor/bizhub-runtime-win32-x64-0.1.0-d3.zip"
          $trust = Get-Content -LiteralPath "config/generic-runtime-trust.win32-x64.json" -Raw | ConvertFrom-Json
          $runtimeSourceMatches = $trust.runtime_source_tree_digest -eq "${{ steps.runtime.outputs.source_tree_digest }}"
          $runtimeManifestMatches = $trust.runtime_manifest_sha256 -eq "${{ steps.runtime.outputs.manifest_sha256 }}"
          if ((Test-Path -LiteralPath $archive) -and $runtimeSourceMatches -and $runtimeManifestMatches) {
            "captured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          & $env:BIZHUB_RUNTIME_PYTHON runtime/build_windows_runtime.py `
            --python $env:BIZHUB_RUNTIME_PYTHON `
            --capture-review-input
          python ../scripts/update_checksums.py
          git add -- `
            ../install/CHECKSUMS.sha256 `
            config/generic-runtime-trust.win32-x64.json `
            runtime/vendor/bizhub-runtime-win32-x64-0.1.0-d3.sha256 `
            runtime/vendor/bizhub-runtime-win32-x64-0.1.0-d3.zip
          $actual = @(git diff --cached --name-only | Sort-Object)
          $expected = @(
            "desktop/config/generic-runtime-trust.win32-x64.json",
            "desktop/runtime/vendor/bizhub-runtime-win32-x64-0.1.0-d3.sha256",
            "desktop/runtime/vendor/bizhub-runtime-win32-x64-0.1.0-d3.zip",
            "install/CHECKSUMS.sha256"
          ) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            throw "desktop_windows_runtime_capture_scope_invalid:$($actual -join ',')"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin Desktop D3 Windows Runtime [skip ci]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          $capturedCommit = git rev-parse HEAD
          "captured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "captured_commit=$capturedCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "::notice title=Desktop D3 Runtime captured::commit=$capturedCommit manifest_sha256=${{ steps.runtime.outputs.manifest_sha256 }} pack_tree_digest=${{ steps.runtime.outputs.pack_tree_digest }} file_count=${{ steps.runtime.outputs.file_count }} source_tree_digest=${{ steps.runtime.outputs.source_tree_digest }}"

      - name: Stop after fixed Runtime capture
        if: steps.capture.outputs.captured == 'true'
        shell: pwsh
        run: |
          Write-Output "The fixed Windows Runtime was committed. A reviewed follow-up commit must trigger the full installer run."

      - name: Install fixed Desktop dependencies
        if: steps.capture.outputs.captured != 'true'
        run: npm ci

      - name: Verify checksums, source tests, and public boundary
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          python ../scripts/verify_checksums.py
          npm test
          npm run verify:boundary
          npm run verify:runtime-archive
          npm run audit:runtime

      - name: Bind rebuilt Runtime to the independent Windows trust record
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          $trust = Get-Content -LiteralPath config/generic-runtime-trust.win32-x64.json -Raw | ConvertFrom-Json
          if ($trust.runtime_manifest_sha256 -ne "${{ steps.runtime.outputs.manifest_sha256 }}") {
            throw "desktop_windows_runtime_manifest_rebuild_mismatch"
          }
          if ($trust.runtime_pack_tree_digest -ne "${{ steps.runtime.outputs.pack_tree_digest }}") {
            throw "desktop_windows_runtime_tree_rebuild_mismatch"
          }
          if ($trust.runtime_pack_file_count -ne [int]"${{ steps.runtime.outputs.file_count }}") {
            throw "desktop_windows_runtime_file_count_rebuild_mismatch"
          }
          if ($trust.runtime_source_tree_digest -ne "${{ steps.runtime.outputs.source_tree_digest }}") {
            throw "desktop_windows_runtime_source_rebuild_mismatch"
          }

      - name: Prepare fixed Windows Runtime
        if: steps.capture.outputs.captured != 'true'
        run: npm run prepare:runtime

      - name: Reject fixed Windows Runtime tamper
        if: steps.capture.outputs.captured != 'true'
        run: npm run smoke:runtime-tamper

      - name: Run Windows Generic Owner lifecycle smoke
        if: steps.capture.outputs.captured != 'true'
        run: npm run smoke:local

      - name: Run Windows Desktop local shell smoke
        if: steps.capture.outputs.captured != 'true'
        run: npm run smoke:local-shell

      - name: Configure isolated Windows signing identity
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        env:
          REQUESTED_SIGNING_MODE: ${{ inputs.signing_mode || 'synthetic-ci' }}
          PRODUCTION_PFX_BASE64: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PRODUCTION_PFX_PASSWORD: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_PASSWORD }}
          PRODUCTION_CERT_THUMBPRINT: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "bizhub-windows-signing.pfx"
          if ($env:REQUESTED_SIGNING_MODE -eq "production") {
            if (-not $env:PRODUCTION_PFX_BASE64 -or -not $env:PRODUCTION_PFX_PASSWORD -or -not $env:PRODUCTION_CERT_THUMBPRINT) {
              throw "desktop_windows_production_signing_credentials_missing"
            }
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:PRODUCTION_PFX_BASE64))
            $certificatePassword = $env:PRODUCTION_PFX_PASSWORD
            $thumbprint = $env:PRODUCTION_CERT_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
            $signingMode = "production"
          } else {
            $certificatePassword = [Guid]::NewGuid().ToString("N")
            Write-Output "::add-mask::$certificatePassword"
            $secureCertificatePassword = ConvertTo-SecureString -String $certificatePassword -AsPlainText -Force
            $certificateIdentity = ./scripts/create-synthetic-windows-signing-certificate.ps1 `
              -OutputPfx $certificatePath `
              -Password $secureCertificatePassword | ConvertFrom-Json
            $thumbprint = $certificateIdentity.thumbprint.Replace(" ", "").ToUpperInvariant()
            $signingMode = "synthetic-ci"
          }
          Write-Output "::add-mask::$certificatePassword"
          "BIZHUB_WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_CERTIFICATE_PASSWORD=$certificatePassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_EXPECTED_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_SIGNING_MODE=$signingMode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_REQUIRE_WINDOWS_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Make signed Squirrel.Windows installer
        if: steps.capture.outputs.captured != 'true'
        run: npm run make:windows

      - name: Scan packaged directory and run cloud smoke
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          npm run verify:artifact -- "out/BizHub Desktop-win32-x64"
          npm run smoke:packaged -- `
            --packaged-executable "out/BizHub Desktop-win32-x64/BizHub Desktop.exe" `
            --packaged-trust-store "out/BizHub Desktop-win32-x64/resources/trusted-connection-keys.json"
          npm run verify:artifact -- "out/BizHub Desktop-win32-x64"

      - name: Install, verify, exercise Owner, uninstall, and preserve data
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          ./scripts/windows-installer-smoke.ps1 `
            -SetupExe "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe" `
            -PackagedDirectory "out/BizHub Desktop-win32-x64" `
            -ExpectedThumbprint $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT `
            -SigningMode $env:BIZHUB_WINDOWS_SIGNING_MODE

      - name: Confirm no residual Desktop or Runtime process
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $root = (Resolve-Path .).Path
          $left = Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -and (
              $_.ExecutablePath.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase) -or
              $_.ExecutablePath.StartsWith((Join-Path $env:LOCALAPPDATA "bizhub_desktop"), [System.StringComparison]::OrdinalIgnoreCase)
            ) -and ($_.Name -in "electron.exe", "BizHub Desktop.exe", "bizhub-runtime.exe")
          }
          if ($left) {
            $left | Select-Object ProcessId, Name, ExecutablePath | Format-Table
            throw "desktop_residual_process_detected"
          }

      - name: Record signed installer identity
        if: steps.capture.outputs.captured != 'true'
        id: product
        shell: pwsh
        run: |
          $setup = Get-Item "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe"
          $nupkgs = @(Get-ChildItem "out/make/squirrel.windows/x64" -Filter "*-full.nupkg")
          if ($nupkgs.Count -ne 1) {
            throw "desktop_windows_full_nupkg_count_invalid:$($nupkgs.Count)"
          }
          $nupkg = $nupkgs[0]
          $releases = Get-Item "out/make/squirrel.windows/x64/RELEASES"
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          $identity = [ordered]@{
            status = "ok"
            commit = (git rev-parse HEAD)
            signing_mode = $env:BIZHUB_WINDOWS_SIGNING_MODE
            signer_subject = $signature.SignerCertificate.Subject
            signer_thumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
            setup = [ordered]@{
              name = $setup.Name
              bytes = $setup.Length
              sha256 = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            nupkg = [ordered]@{
              name = $nupkg.Name
              bytes = $nupkg.Length
              sha256 = (Get-FileHash -LiteralPath $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            releases_sha256 = (Get-FileHash -LiteralPath $releases.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $identity | ConvertTo-Json -Depth 5 | Out-File -FilePath out/desktop-d3-windows-x64-identity.json -Encoding utf8
          $identity | ConvertTo-Json -Depth 5 -Compress
          "setup_sha256=$($identity.setup.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_bytes=$($identity.setup.bytes)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload D3 Windows installer evidence
        if: steps.capture.outputs.captured != 'true'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-d3-windows-x64-${{ github.sha }}-${{ env.BIZHUB_WINDOWS_SIGNING_MODE }}
          path: |
            desktop/out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe
            desktop/out/make/squirrel.windows/x64/*-full.nupkg
            desktop/out/make/squirrel.windows/x64/RELEASES
            desktop/out/desktop-d3-windows-x64-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish public machine-readable D3 identity
        if: steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          Write-Output "::notice title=Desktop D3 Windows installer identity::commit=${{ github.sha }} signing_mode=$env:BIZHUB_WINDOWS_SIGNING_MODE setup_bytes=${{ steps.product.outputs.setup_bytes }} setup_sha256=${{ steps.product.outputs.setup_sha256 }} artifact_id=${{ steps.upload.outputs.artifact-id }} artifact_digest=${{ steps.upload.outputs.artifact-digest }}"

      - name: Remove signing material
        if: always() && steps.capture.outputs.captured != 'true'
        shell: pwsh
        run: |
          if ($env:BIZHUB_WINDOWS_CERTIFICATE_FILE -and (Test-Path -LiteralPath $env:BIZHUB_WINDOWS_CERTIFICATE_FILE)) {
            Remove-Item -LiteralPath $env:BIZHUB_WINDOWS_CERTIFICATE_FILE -Force
          }
          if ($env:BIZHUB_WINDOWS_CERTIFICATE_FILE -and (Test-Path -LiteralPath "$env:BIZHUB_WINDOWS_CERTIFICATE_FILE.cer")) {
            Remove-Item -LiteralPath "$env:BIZHUB_WINDOWS_CERTIFICATE_FILE.cer" -Force
          }
          if ($env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT) {
            $certificate = "Cert:\LocalMachine\TrustedPeople\$env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT"
            if (Test-Path -LiteralPath $certificate) {
              Remove-Item -LiteralPath $certificate -Force
            }
          }
