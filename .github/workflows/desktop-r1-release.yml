name: Desktop R1 Release

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Production requires the separately approved publisher credentials and release inputs.
        required: true
        type: choice
        default: synthetic-ci
        options:
          - synthetic-ci
          - production
      release_commit:
        description: Exact public main commit to release in production mode.
        required: false
        type: string
      release_tag:
        description: desktop-vPACKAGE_VERSION or desktop-vPACKAGE_VERSION-preview.N.
        required: false
        type: string
      publish:
        description: Create the immutable GitHub Release after both signed products pass.
        required: true
        type: boolean
        default: false
  push:
    branches:
      - codex/desktop-r1-release-20260826

permissions:
  contents: read

concurrency:
  group: desktop-r1-release-${{ github.ref }}-${{ inputs.signing_mode || 'synthetic-ci' }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 50
    env:
      RELEASE_MODE: ${{ inputs.signing_mode || 'synthetic-ci' }}
      BIZHUB_DESKTOP_RELEASE_MODE: ${{ inputs.signing_mode || 'synthetic-ci' }}
      BIZHUB_DESKTOP_RELEASE_COMMIT: ${{ inputs.release_commit || '' }}
      BIZHUB_DESKTOP_RELEASE_TAG: ${{ inputs.release_tag || '' }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.10

      - name: Verify fixed macOS target
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = arm64

      - name: Install fixed Desktop dependencies
        run: npm ci

      - name: Verify source, release gate, tests, and public boundary
        shell: bash
        run: |
          python ../scripts/verify_checksums.py
          node scripts/release-preflight.mjs
          npm test
          npm run verify:boundary
          npm run verify:runtime-archive
          npm run audit:runtime
          npm audit --audit-level=moderate

      - name: Prepare fixed Runtime and exercise development product flows
        shell: bash
        run: |
          npm run prepare:runtime
          npm run smoke:runtime-tamper
          npm run smoke:local
          npm run smoke:account-flow
          npm run smoke:local-shell

      - name: Configure macOS publisher identity
        shell: bash
        env:
          APPLE_API_ISSUER_SECRET: ${{ secrets.BIZHUB_APPLE_API_ISSUER }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.BIZHUB_APPLE_API_KEY_ID }}
          APPLE_API_KEY_SECRET: ${{ secrets.BIZHUB_APPLE_API_KEY_P8 }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.BIZHUB_MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BIZHUB_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY_SECRET: ${{ secrets.BIZHUB_MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID_SECRET: ${{ secrets.BIZHUB_MACOS_TEAM_ID }}
        run: |
          echo "BIZHUB_MACOS_SIGNING_MODE=$RELEASE_MODE" >> "$GITHUB_ENV"
          if [ "$RELEASE_MODE" = synthetic-ci ]; then
            echo 'BIZHUB_MACOS_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            exit 0
          fi
          test -n "$MACOS_CERTIFICATE_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY_SECRET"
          test -n "$MACOS_TEAM_ID_SECRET"
          test -n "$APPLE_API_KEY_SECRET"
          test -n "$APPLE_API_KEY_ID_SECRET"
          test -n "$APPLE_API_ISSUER_SECRET"
          certificate="$RUNNER_TEMP/bizhub-developer-id.p12"
          api_key="$RUNNER_TEMP/bizhub-notary-api-key.p8"
          keychain="$RUNNER_TEMP/bizhub-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | openssl base64 -d -A > "$certificate"
          printf '%s' "$APPLE_API_KEY_SECRET" > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_SIGNING_IDENTITY_SECRET"
          echo "BIZHUB_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          echo "BIZHUB_MACOS_TEAM_ID=$MACOS_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          echo "BIZHUB_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "BIZHUB_APPLE_API_KEY_FILE=$api_key" >> "$GITHUB_ENV"
          echo "BIZHUB_APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
          echo "BIZHUB_APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
          echo "BIZHUB_MACOS_TEMP_CERTIFICATE=$certificate" >> "$GITHUB_ENV"

      - name: Bind the fixed Runtime Pack to the publisher identity
        run: node scripts/prepare-signed-macos-runtime.mjs

      - name: Package and sign the macOS application
        shell: bash
        run: |
          npm run make:macos-release
          if [ "$RELEASE_MODE" = synthetic-ci ]; then
            node scripts/sign-synthetic-macos-app.mjs
          else
            node scripts/sign-production-macos-app.mjs
          fi

      - name: Verify signed product and exercise packaged flows
        shell: bash
        run: |
          product="out/BizHub Desktop-darwin-arm64"
          app="$product/BizHub Desktop.app"
          executable="$app/Contents/MacOS/BizHub Desktop"
          resources="$app/Contents/Resources"
          npm run verify:artifact -- "$product" --expected-runtime-trust runtime-dist/generic-runtime-trust.json
          release_args=(
            --app "$app"
            --expected-runtime-trust runtime-dist/generic-runtime-trust.json
            --mode "$RELEASE_MODE"
          )
          if [ "$RELEASE_MODE" = production ]; then
            release_args+=(--team-id "$BIZHUB_MACOS_TEAM_ID")
          fi
          node scripts/verify-macos-release.mjs "${release_args[@]}"
          node scripts/account-flow-smoke.mjs \
            --packaged-executable "$executable" \
            --packaged-trust-store "$resources/trusted-connection-keys.json" \
            --packaged-account-directory "$resources/account-directory.json"
          node scripts/local-shell-smoke.mjs \
            --packaged-executable "$executable" \
            --packaged-resources "$resources"
          npm run verify:artifact -- "$product" --expected-runtime-trust runtime-dist/generic-runtime-trust.json
          node scripts/verify-macos-release.mjs "${release_args[@]}"

      - name: Create and verify signed ZIP and DMG
        run: |
          node scripts/make-macos-release-containers.mjs
          node scripts/verify-macos-release-containers.mjs

      - name: Confirm no residual Desktop or Runtime process
        shell: bash
        run: |
          sleep 2
          ! pgrep -fl 'bizhub-runtime|BizHub Desktop.app/Contents/MacOS/BizHub Desktop'

      - name: Upload macOS R1 evidence
        id: mac_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desktop-r1-macos-arm64-${{ github.sha }}-${{ env.RELEASE_MODE }}
          path: |
            desktop/out/release/BizHub-Desktop-*-macOS-arm64.zip
            desktop/out/release/BizHub-Desktop-*-macOS-arm64.dmg
            desktop/out/release/desktop-r1-macos-containers.json
            desktop/out/desktop-r1-macos-release-identity.json
            desktop/out/desktop-r1-macos-runtime-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish macOS candidate identity
        shell: bash
        run: |
          echo "::notice title=Desktop R1 macOS candidate::commit=${{ github.sha }} signing_mode=$RELEASE_MODE artifact_id=${{ steps.mac_upload.outputs.artifact-id }} artifact_digest=${{ steps.mac_upload.outputs.artifact-digest }}"
          cat out/release/desktop-r1-macos-containers.json

      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${BIZHUB_MACOS_KEYCHAIN:-}" ] && [ -e "$BIZHUB_MACOS_KEYCHAIN" ]; then
            security delete-keychain "$BIZHUB_MACOS_KEYCHAIN" || true
          fi
          for sensitive_path in "${BIZHUB_MACOS_TEMP_CERTIFICATE:-}" "${BIZHUB_APPLE_API_KEY_FILE:-}"; do
            if [ -n "$sensitive_path" ] && [ -e "$sensitive_path" ]; then
              rm -f -- "$sensitive_path"
            fi
          done

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      RELEASE_MODE: ${{ inputs.signing_mode || 'synthetic-ci' }}
      BIZHUB_DESKTOP_RELEASE_MODE: ${{ inputs.signing_mode || 'synthetic-ci' }}
      BIZHUB_DESKTOP_RELEASE_COMMIT: ${{ inputs.release_commit || '' }}
      BIZHUB_DESKTOP_RELEASE_TAG: ${{ inputs.release_tag || '' }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Preserve repository byte identity
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.10

      - name: Verify fixed Windows target
        shell: pwsh
        run: |
          if ((node -p "process.platform") -ne "win32") { throw "desktop_r1_windows_platform_invalid" }
          if ((node -p "process.arch") -ne "x64") { throw "desktop_r1_windows_architecture_invalid" }

      - name: Install fixed Desktop dependencies
        run: npm ci

      - name: Verify source, release gate, tests, and public boundary
        shell: pwsh
        run: |
          python ../scripts/verify_checksums.py
          node scripts/release-preflight.mjs
          npm test
          npm run verify:boundary
          npm run verify:runtime-archive
          npm run audit:runtime
          npm audit --audit-level=moderate

      - name: Prepare fixed Runtime and exercise development product flows
        shell: pwsh
        run: |
          npm run prepare:runtime
          npm run smoke:runtime-tamper
          npm run smoke:local
          npm run smoke:account-flow
          npm run smoke:local-shell

      - name: Configure Windows publisher identity
        shell: pwsh
        env:
          PRODUCTION_CERTIFICATE_BASE64: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PRODUCTION_CERTIFICATE_PASSWORD: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_PASSWORD }}
          PRODUCTION_CERTIFICATE_THUMBPRINT: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "bizhub-windows-signing.pfx"
          if ($env:RELEASE_MODE -eq "production") {
            if (-not $env:PRODUCTION_CERTIFICATE_BASE64 -or -not $env:PRODUCTION_CERTIFICATE_PASSWORD -or -not $env:PRODUCTION_CERTIFICATE_THUMBPRINT) {
              throw "desktop_windows_production_signing_credentials_missing"
            }
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:PRODUCTION_CERTIFICATE_BASE64))
            $certificatePassword = $env:PRODUCTION_CERTIFICATE_PASSWORD
            $thumbprint = $env:PRODUCTION_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          } else {
            $certificatePassword = [Guid]::NewGuid().ToString("N")
            Write-Output "::add-mask::$certificatePassword"
            $securePassword = ConvertTo-SecureString -String $certificatePassword -AsPlainText -Force
            $identity = ./scripts/create-synthetic-windows-signing-certificate.ps1 `
              -OutputPfx $certificatePath `
              -Password $securePassword | ConvertFrom-Json
            $thumbprint = $identity.thumbprint.Replace(" ", "").ToUpperInvariant()
          }
          Write-Output "::add-mask::$certificatePassword"
          "BIZHUB_WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_CERTIFICATE_PASSWORD=$certificatePassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_EXPECTED_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_SIGNING_MODE=$env:RELEASE_MODE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_REQUIRE_WINDOWS_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Make signed Squirrel.Windows installer
        run: npm run make:windows

      - name: Verify signed packaged application and account flows
        shell: pwsh
        run: |
          $product = "out/BizHub Desktop-win32-x64"
          $executable = "$product/BizHub Desktop.exe"
          $resources = "$product/resources"
          npm run verify:artifact -- $product
          node scripts/account-flow-smoke.mjs `
            --packaged-executable $executable `
            --packaged-trust-store "$resources/trusted-connection-keys.json" `
            --packaged-account-directory "$resources/account-directory.json"
          node scripts/local-shell-smoke.mjs `
            --packaged-executable $executable `
            --packaged-resources $resources
          npm run verify:artifact -- $product

      - name: Install, verify Owner lifecycle, uninstall, and preserve data
        shell: pwsh
        run: |
          ./scripts/windows-installer-smoke.ps1 `
            -SetupExe "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe" `
            -PackagedDirectory "out/BizHub Desktop-win32-x64" `
            -ExpectedThumbprint $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT `
            -SigningMode $env:BIZHUB_WINDOWS_SIGNING_MODE

      - name: Record signed Windows release identity
        shell: pwsh
        run: |
          $output = "out/make/squirrel.windows/x64"
          $setup = Get-Item "$output/BizHub-Desktop-Setup-x64.exe"
          $nupkgs = @(Get-ChildItem $output -Filter "*-full.nupkg")
          if ($nupkgs.Count -ne 1) { throw "desktop_windows_full_nupkg_count_invalid:$($nupkgs.Count)" }
          $nupkg = $nupkgs[0]
          $releases = Get-Item "$output/RELEASES"
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "desktop_windows_release_signature_invalid:$($signature.Status)"
          }
          $thumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant()
          if ($thumbprint -ne $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT) {
            throw "desktop_windows_release_signer_mismatch"
          }
          if ($env:RELEASE_MODE -eq "production" -and -not $signature.TimeStamperCertificate) {
            throw "desktop_windows_release_timestamp_missing"
          }
          $identity = [ordered]@{
            status = "ok"
            schema_version = "bizhub.desktop-windows-release-identity.v1"
            commit = (git rev-parse HEAD)
            signing_mode = $env:RELEASE_MODE
            signer_subject = $signature.SignerCertificate.Subject
            signer_thumbprint = $thumbprint
            timestamp_subject = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { $null }
            setup = [ordered]@{
              name = $setup.Name
              bytes = $setup.Length
              sha256 = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            nupkg = [ordered]@{
              name = $nupkg.Name
              bytes = $nupkg.Length
              sha256 = (Get-FileHash -LiteralPath $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            releases_sha256 = (Get-FileHash -LiteralPath $releases.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $identity | ConvertTo-Json -Depth 5 | Out-File -FilePath out/desktop-r1-windows-x64-identity.json -Encoding utf8
          $identity | ConvertTo-Json -Depth 5 -Compress

      - name: Confirm no residual Desktop or Runtime process
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $root = (Resolve-Path .).Path
          $installRoot = Join-Path $env:LOCALAPPDATA "bizhub_desktop"
          $left = Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -and (
              $_.ExecutablePath.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase) -or
              $_.ExecutablePath.StartsWith($installRoot, [System.StringComparison]::OrdinalIgnoreCase)
            ) -and ($_.Name -in "electron.exe", "BizHub Desktop.exe", "bizhub-runtime.exe")
          }
          if ($left) {
            $left | Select-Object ProcessId, Name, ExecutablePath | Format-Table
            throw "desktop_residual_process_detected"
          }

      - name: Upload Windows R1 evidence
        id: windows_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desktop-r1-windows-x64-${{ github.sha }}-${{ env.RELEASE_MODE }}
          path: |
            desktop/out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe
            desktop/out/make/squirrel.windows/x64/*-full.nupkg
            desktop/out/make/squirrel.windows/x64/RELEASES
            desktop/out/desktop-r1-windows-x64-identity.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows candidate identity
        shell: pwsh
        run: |
          Write-Output "::notice title=Desktop R1 Windows candidate::commit=${{ github.sha }} signing_mode=$env:RELEASE_MODE artifact_id=${{ steps.windows_upload.outputs.artifact-id }} artifact_digest=${{ steps.windows_upload.outputs.artifact-digest }}"
          Get-Content -LiteralPath out/desktop-r1-windows-x64-identity.json -Raw

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:BIZHUB_WINDOWS_CERTIFICATE_FILE -and (Test-Path -LiteralPath $env:BIZHUB_WINDOWS_CERTIFICATE_FILE)) {
            Remove-Item -LiteralPath $env:BIZHUB_WINDOWS_CERTIFICATE_FILE -Force
          }
          if ($env:BIZHUB_WINDOWS_CERTIFICATE_FILE -and (Test-Path -LiteralPath "$env:BIZHUB_WINDOWS_CERTIFICATE_FILE.cer")) {
            Remove-Item -LiteralPath "$env:BIZHUB_WINDOWS_CERTIFICATE_FILE.cer" -Force
          }
          if ($env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT) {
            $certificate = "Cert:\LocalMachine\TrustedPeople\$env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT"
            if (Test-Path -LiteralPath $certificate) { Remove-Item -LiteralPath $certificate -Force }
          }

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'production' && inputs.publish == true
    needs:
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Recheck immutable release identity
        working-directory: desktop
        env:
          BIZHUB_DESKTOP_RELEASE_MODE: production
          BIZHUB_DESKTOP_RELEASE_COMMIT: ${{ inputs.release_commit }}
          BIZHUB_DESKTOP_RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REF: refs/heads/main
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.release_commit }}"
          node scripts/release-preflight.mjs

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: desktop-r1-*-${{ inputs.release_commit }}-production
          path: release-artifacts
          merge-multiple: true

      - name: Verify cross-platform evidence and write checksums
        shell: bash
        run: |
          test "$(jq -r .signing_mode release-artifacts/desktop-r1-macos-containers.json)" = production
          test "$(jq -r .signing_mode release-artifacts/desktop-r1-macos-release-identity.json)" = production
          test "$(jq -r .signing_mode release-artifacts/desktop-r1-windows-x64-identity.json)" = production
          test "$(jq -r .commit release-artifacts/desktop-r1-windows-x64-identity.json)" = "${{ inputs.release_commit }}"
          test "$(find release-artifacts -maxdepth 1 -type f -name 'BizHub-Desktop-*-macOS-arm64.dmg' | wc -l)" = 1
          test "$(find release-artifacts -maxdepth 1 -type f -name 'BizHub-Desktop-*-macOS-arm64.zip' | wc -l)" = 1
          test "$(find release-artifacts -maxdepth 1 -type f -name 'BizHub-Desktop-Setup-x64.exe' | wc -l)" = 1
          test "$(find release-artifacts -maxdepth 1 -type f -name '*-full.nupkg' | wc -l)" = 1
          test "$(find release-artifacts -maxdepth 1 -type f -name 'RELEASES' | wc -l)" = 1
          cd release-artifacts
          sha256sum \
            BizHub-Desktop-*-macOS-arm64.dmg \
            BizHub-Desktop-*-macOS-arm64.zip \
            BizHub-Desktop-Setup-x64.exe \
            *-full.nupkg \
            RELEASES \
            desktop-r1-*-identity.json \
            desktop-r1-macos-containers.json \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create immutable Desktop Release and read it back
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          commit="${{ inputs.release_commit }}"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "desktop_release_tag_already_exists:$tag" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "desktop_release_already_exists:$tag" >&2
            exit 1
          fi
          version="$(jq -r .version desktop/package.json)"
          notes="$RUNNER_TEMP/desktop-release-notes.md"
          printf '%s\n' \
            "BizHub Desktop $version" \
            "" \
            "One customer-neutral installer. Account lookup selects a signed cloud Workspace, while an unknown account may explicitly create an isolated Generic Local instance." \
            "" \
            "Built from fixed public commit $commit. macOS arm64 is Developer ID signed and notarized; Windows x64 is Authenticode signed. SHA256SUMS is included." \
            > "$notes"
          prerelease=()
          if [[ "$tag" == *-preview.* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$commit" \
            --title "BizHub Desktop $version" \
            --notes-file "$notes" \
            "${prerelease[@]}" \
            release-artifacts/BizHub-Desktop-*-macOS-arm64.dmg \
            release-artifacts/BizHub-Desktop-*-macOS-arm64.zip \
            release-artifacts/BizHub-Desktop-Setup-x64.exe \
            release-artifacts/*-full.nupkg \
            release-artifacts/RELEASES \
            release-artifacts/desktop-r1-*-identity.json \
            release-artifacts/desktop-r1-macos-containers.json \
            release-artifacts/SHA256SUMS
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$commit"
          readback="$RUNNER_TEMP/desktop-release-readback"
          mkdir "$readback"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$readback"
          cp release-artifacts/SHA256SUMS "$readback/SHA256SUMS.expected"
          cd "$readback"
          sha256sum --check SHA256SUMS.expected
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
