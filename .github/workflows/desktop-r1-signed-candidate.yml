name: Desktop R1 Signed Candidate

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact current public main commit.
        required: true
        type: string
      release_tag:
        description: desktop-vPACKAGE_VERSION or desktop-vPACKAGE_VERSION-preview.N.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-r1-signed-candidate-${{ inputs.release_commit }}
  cancel-in-progress: false

jobs:
  macos_arm64:
    name: desktop-r1-signed-candidate-macos-arm64
    if: github.ref == 'refs/heads/main'
    environment: desktop-production-signing
    runs-on: [self-hosted, installer-macos]
    timeout-minutes: 90
    outputs:
      record_digest: ${{ steps.store.outputs['record-digest'] }}
      record_attempt: ${{ steps.store.outputs['record-attempt'] }}
    env:
      BIZHUB_DESKTOP_RELEASE_MODE: production
      BIZHUB_DESKTOP_RELEASE_COMMIT: ${{ inputs.release_commit }}
      BIZHUB_DESKTOP_RELEASE_TAG: ${{ inputs.release_tag }}
      BIZHUB_MACOS_SIGNING_MODE: production
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Verify existing Python 3.12 toolchain
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Verify exact main source and release contract
        shell: /Users/cc/.local/bin/ci-slot --test-workers 4 --test-min-workers 1 -- bash --noprofile --norc -eo pipefail {0}
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "${{ inputs.release_commit }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.release_commit }}"
          python ../scripts/verify_checksums.py
          npm ci
          node scripts/release-preflight.mjs
          npm test
          npm run verify:boundary
          npm run verify:runtime-archive
          npm run audit:runtime
          npm audit --audit-level=moderate
      - name: Configure approved macOS publisher
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.BIZHUB_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.BIZHUB_MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.BIZHUB_MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.BIZHUB_MACOS_TEAM_ID }}
          API_KEY_P8: ${{ secrets.BIZHUB_APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.BIZHUB_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.BIZHUB_APPLE_API_ISSUER }}
        run: |
          test -n "$CERTIFICATE_BASE64" && test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY" && test -n "$TEAM_ID"
          test -n "$API_KEY_P8" && test -n "$API_KEY_ID" && test -n "$API_ISSUER"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/bizhub-signing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          certificate="$signing_dir/developer-id.p12"
          api_key="$signing_dir/notary-api-key.p8"
          keychain="$signing_dir/signing.keychain-db"
          {
            echo "BIZHUB_MACOS_SIGNING_DIR=$signing_dir"
            echo "BIZHUB_MACOS_TEMP_CERTIFICATE=$certificate"
            echo "BIZHUB_MACOS_KEYCHAIN=$keychain"
            echo "BIZHUB_APPLE_API_KEY_FILE=$api_key"
          } >> "$GITHUB_ENV"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | openssl base64 -d -A > "$certificate"
          printf '%s' "$API_KEY_P8" > "$api_key"
          chmod 600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f -- "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$SIGNING_IDENTITY" >/dev/null
          echo "BIZHUB_MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "BIZHUB_MACOS_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BIZHUB_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "BIZHUB_APPLE_API_KEY_FILE=$api_key" >> "$GITHUB_ENV"
          echo "BIZHUB_APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "BIZHUB_APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
          echo "BIZHUB_MACOS_TEMP_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
      - name: Prepare, sign, and rebind Runtime
        shell: /Users/cc/.local/bin/ci-slot --test-workers 4 --test-min-workers 1 -- bash --noprofile --norc -eo pipefail {0}
        run: |
          npm run prepare:runtime
          node scripts/prepare-signed-macos-runtime.mjs
      - name: Build notarized old and current products
        shell: /Users/cc/.local/bin/ci-slot --test-workers 4 --test-min-workers 1 -- bash --noprofile --norc -eo pipefail {0}
        run: |
          current_version="$(node -p 'require("./package.json").version')"
          old_version="$(node scripts/package-version-fixture.mjs previous "$current_version")"
          cp package.json "$RUNNER_TEMP/package.json"
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          node scripts/package-version-fixture.mjs set "$old_version"
          npm run make:macos-release
          node scripts/sign-production-macos-app.mjs
          /usr/bin/ditto "out/BizHub Desktop-darwin-arm64/BizHub Desktop.app" "$RUNNER_TEMP/BizHub Desktop-old.app"
          cp "$RUNNER_TEMP/package.json" package.json
          cp "$RUNNER_TEMP/package-lock.json" package-lock.json
          rm -rf "out/BizHub Desktop-darwin-arm64"
          npm run make:macos-release
          node scripts/sign-production-macos-app.mjs
          node scripts/macos-upgrade-rollback-smoke.mjs --old-app "$RUNNER_TEMP/BizHub Desktop-old.app" --new-app "out/BizHub Desktop-darwin-arm64/BizHub Desktop.app" --old-version "$old_version" --new-version "$current_version" --output out/desktop-r1-macos-upgrade-rollback.json
          git diff --exit-code -- package.json package-lock.json
      - name: Verify notarized current product and containers
        shell: /Users/cc/.local/bin/ci-slot --test-workers 4 --test-min-workers 1 -- bash --noprofile --norc -eo pipefail {0}
        run: |
          product="out/BizHub Desktop-darwin-arm64"
          app="$product/BizHub Desktop.app"
          resources="$app/Contents/Resources"
          npm run verify:artifact -- "$product" --expected-runtime-trust runtime-dist/generic-runtime-trust.json
          node scripts/verify-macos-release.mjs --app "$app" --expected-runtime-trust runtime-dist/generic-runtime-trust.json --mode production --team-id "$BIZHUB_MACOS_TEAM_ID"
          node scripts/account-flow-smoke.mjs --packaged-executable "$app/Contents/MacOS/BizHub Desktop" --packaged-trust-store "$resources/trusted-connection-keys.json" --packaged-account-directory "$resources/account-directory.json"
          node scripts/local-shell-smoke.mjs --packaged-executable "$app/Contents/MacOS/BizHub Desktop" --packaged-resources "$resources"
          node scripts/make-macos-release-containers.mjs
          node scripts/verify-macos-release-containers.mjs
          mkdir -p out/candidate-macos
          cp out/release/BizHub-Desktop-*-macOS-arm64.zip out/candidate-macos/
          cp out/release/BizHub-Desktop-*-macOS-arm64.dmg out/candidate-macos/
          cp out/release/desktop-r1-macos-containers.json out/candidate-macos/
          cp out/desktop-r1-macos-release-identity.json out/candidate-macos/
          cp out/desktop-r1-macos-runtime-identity.json out/candidate-macos/
          cp out/desktop-r1-macos-upgrade-rollback.json out/candidate-macos/
          sleep 2
          ! pgrep -fl 'bizhub-runtime|BizHub Desktop.app/Contents/MacOS/BizHub Desktop'
      - name: Preserve fixed macOS signed candidate locally
        id: store
        shell: bash
        run: python ../scripts/ci_artifacts.py store --commit "${{ inputs.release_commit }}" --name signed-macos "out/candidate-macos/*"
      - name: Remove macOS signing material
        if: always()
        shell: bash
        run: |
          cleanup_status=0
          if [ -n "${BIZHUB_MACOS_KEYCHAIN:-}" ] && [ -e "$BIZHUB_MACOS_KEYCHAIN" ]; then
            if ! security delete-keychain "$BIZHUB_MACOS_KEYCHAIN"; then cleanup_status=1; fi
          fi
          if [ -n "${BIZHUB_MACOS_TEMP_CERTIFICATE:-}" ]; then
            if ! rm -f -- "$BIZHUB_MACOS_TEMP_CERTIFICATE"; then cleanup_status=1; fi
          fi
          if [ -n "${BIZHUB_APPLE_API_KEY_FILE:-}" ]; then
            if ! rm -f -- "$BIZHUB_APPLE_API_KEY_FILE"; then cleanup_status=1; fi
          fi
          if [ -n "${BIZHUB_MACOS_SIGNING_DIR:-}" ]; then
            if ! rmdir -- "$BIZHUB_MACOS_SIGNING_DIR"; then cleanup_status=1; fi
            if [ -e "$BIZHUB_MACOS_SIGNING_DIR" ]; then cleanup_status=1; fi
          fi
          exit "$cleanup_status"

  windows_x64:
    name: desktop-r1-signed-candidate-windows-x64
    if: github.ref == 'refs/heads/main'
    environment: desktop-production-signing
    runs-on: [self-hosted, installer-windows]
    timeout-minutes: 90
    outputs:
      record_digest: ${{ steps.store.outputs['record-digest'] }}
      record_attempt: ${{ steps.store.outputs['record-attempt'] }}
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      BIZHUB_DESKTOP_RELEASE_MODE: production
      BIZHUB_DESKTOP_RELEASE_COMMIT: ${{ inputs.release_commit }}
      BIZHUB_DESKTOP_RELEASE_TAG: ${{ inputs.release_tag }}
      BIZHUB_WINDOWS_SIGNING_MODE: production
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - name: Protect existing Windows user state
        shell: pwsh
        run: ../scripts/require-clean-windows-ci-user.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Verify existing Python 3.12 toolchain
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Verify exact main source and release contract
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -ne "${{ inputs.release_commit }}" -or (git rev-parse origin/main) -ne "${{ inputs.release_commit }}") { throw "desktop_release_main_commit_mismatch" }
          python ../scripts/verify_checksums.py
          npm ci
          node scripts/release-preflight.mjs
          npm test
          npm run verify:boundary
          npm run verify:runtime-archive
          npm run audit:runtime
          npm audit --audit-level=moderate
      - name: Require existing approved Windows publisher
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ secrets.BIZHUB_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:CERTIFICATE_THUMBPRINT -notmatch '^[0-9a-fA-F ]{40,59}$') { throw "desktop_windows_production_signing_credentials_missing" }
          $thumbprint = $env:CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          $certificate = Get-Item "Cert:/CurrentUser/My/$thumbprint" -ErrorAction Stop
          if (-not $certificate.HasPrivateKey) { throw "desktop_windows_existing_store_identity_missing" }
          "BIZHUB_WINDOWS_CERTIFICATE_SHA1=$thumbprint" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_WINDOWS_EXPECTED_THUMBPRINT=$thumbprint" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BIZHUB_REQUIRE_WINDOWS_SIGNING=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare, sign, and rebind Runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run prepare:runtime
          node scripts/prepare-signed-windows-runtime.mjs
          ./scripts/verify-windows-runtime-signatures.ps1 -RuntimeRoot runtime-dist/bizhub-runtime -PreparationIdentity out/desktop-r1-windows-runtime-preparation.json -ExpectedThumbprint $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT -Output out/desktop-r1-windows-runtime-identity.json -SigningMode production
      - name: Build old and current signed installers
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $currentVersion = node -p "require('./package.json').version"
          $oldVersion = node scripts/package-version-fixture.mjs previous $currentVersion
          Copy-Item package.json "$env:RUNNER_TEMP/package.json"
          Copy-Item package-lock.json "$env:RUNNER_TEMP/package-lock.json"
          node scripts/package-version-fixture.mjs set $oldVersion
          npm run make:windows-release
          Copy-Item "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe" "$env:RUNNER_TEMP/BizHub-Desktop-Setup-old.exe"
          Copy-Item "$env:RUNNER_TEMP/package.json" package.json
          Copy-Item "$env:RUNNER_TEMP/package-lock.json" package-lock.json
          Remove-Item "out/make" -Recurse -Force
          Remove-Item "out/BizHub Desktop-win32-x64" -Recurse -Force
          npm run make:windows-release
          ./scripts/windows-upgrade-rollback-smoke.ps1 -OldSetup "$env:RUNNER_TEMP/BizHub-Desktop-Setup-old.exe" -NewSetup "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe" -OldVersion $oldVersion -NewVersion $currentVersion -ExpectedThumbprint $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT -RuntimePreparationIdentity out/desktop-r1-windows-runtime-preparation.json -Output out/desktop-r1-windows-upgrade-rollback.json -SigningMode production
          git diff --exit-code -- package.json package-lock.json
      - name: Verify signed current product and record identity
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $product = "out/BizHub Desktop-win32-x64"
          $resources = "$product/resources"
          npm run verify:artifact -- $product --expected-runtime-trust runtime-dist/generic-runtime-trust.json
          node scripts/account-flow-smoke.mjs --packaged-executable "$product/BizHub Desktop.exe" --packaged-trust-store "$resources/trusted-connection-keys.json" --packaged-account-directory "$resources/account-directory.json"
          node scripts/local-shell-smoke.mjs --packaged-executable "$product/BizHub Desktop.exe" --packaged-resources $resources
          ./scripts/windows-installer-smoke.ps1 -SetupExe "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe" -PackagedDirectory $product -ExpectedThumbprint $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT -SigningMode production -RuntimePreparationIdentity out/desktop-r1-windows-runtime-preparation.json -RuntimeIdentityOutput out/desktop-r1-windows-runtime-identity.json
          $output = "out/make/squirrel.windows/x64"
          $setup = Get-Item "$output/BizHub-Desktop-Setup-x64.exe"
          $nupkgs = @(Get-ChildItem $output -Filter "*-full.nupkg")
          if ($nupkgs.Count -ne 1) { throw "desktop_windows_full_nupkg_count_invalid:$($nupkgs.Count)" }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or -not $signature.TimeStamperCertificate) { throw "desktop_windows_release_signature_invalid" }
          $identity = [ordered]@{
            status = "ok"; schema_version = "bizhub.desktop-windows-release-identity.v1"; commit = (git rev-parse HEAD); signing_mode = "production"
            signer_subject = $signature.SignerCertificate.Subject; signer_thumbprint = $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant(); timestamp_subject = $signature.TimeStamperCertificate.Subject
            setup = [ordered]@{ name = $setup.Name; bytes = $setup.Length; sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            nupkg = [ordered]@{ name = $nupkgs[0].Name; bytes = $nupkgs[0].Length; sha256 = (Get-FileHash $nupkgs[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            releases_sha256 = (Get-FileHash "$output/RELEASES" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($identity.signer_thumbprint -ne $env:BIZHUB_WINDOWS_EXPECTED_THUMBPRINT) { throw "desktop_windows_release_signer_mismatch" }
          $identity | ConvertTo-Json -Depth 5 | Out-File out/desktop-r1-windows-x64-identity.json -Encoding utf8
          New-Item -ItemType Directory -Path out/candidate-windows -Force | Out-Null
          Copy-Item "$output/BizHub-Desktop-Setup-x64.exe" out/candidate-windows/
          Copy-Item $nupkgs[0].FullName out/candidate-windows/
          Copy-Item "$output/RELEASES" out/candidate-windows/
          Copy-Item out/desktop-r1-windows-x64-identity.json out/candidate-windows/
          Copy-Item out/desktop-r1-windows-runtime-identity.json out/candidate-windows/
          Copy-Item out/desktop-r1-windows-upgrade-rollback.json out/candidate-windows/
      - name: Preserve fixed Windows signed candidate locally
        id: store
        shell: pwsh
        run: python ../scripts/ci_artifacts.py store --commit "${{ inputs.release_commit }}" --name signed-windows "out/candidate-windows/*"

  release-plan:
    name: desktop-r1-signed-candidate-release-plan
    if: github.ref == 'refs/heads/main'
    needs: [macos_arm64, windows_x64]
    runs-on: [self-hosted, installer-control]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Read exact macos signed record
        shell: bash
        run: python scripts/ci_artifacts.py read --commit "${{ inputs.release_commit }}" --name signed-macos --attempt "${{ needs.macos_arm64.outputs.record_attempt }}" --digest "${{ needs.macos_arm64.outputs.record_digest }}" --output candidate/macos
      - name: Read exact windows signed record
        shell: bash
        run: python scripts/ci_artifacts.py read --commit "${{ inputs.release_commit }}" --name signed-windows --attempt "${{ needs.windows_x64.outputs.record_attempt }}" --digest "${{ needs.windows_x64.outputs.record_digest }}" --output candidate/windows --windows
      - name: Build deterministic Owner approval plan
        working-directory: desktop
        run: |
          node scripts/release-plan.mjs build \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --commit "${{ inputs.release_commit }}" \
            --tag "${{ inputs.release_tag }}" \
            --mac-root ../candidate/macos \
            --mac-record-attempt "${{ needs.macos_arm64.outputs.record_attempt }}" \
            --mac-record-name signed-macos \
            --mac-record-digest "${{ needs.macos_arm64.outputs.record_digest }}" \
            --windows-root ../candidate/windows \
            --windows-record-attempt "${{ needs.windows_x64.outputs.record_attempt }}" \
            --windows-record-name signed-windows \
            --windows-record-digest "${{ needs.windows_x64.outputs.record_digest }}" \
            --output ../candidate/desktop-r1-release-plan.json
          shasum -a 256 ../candidate/desktop-r1-release-plan.json | tee ../candidate/desktop-r1-release-plan.sha256
      - name: Preserve exact Owner approval plan locally
        shell: bash
        run: python scripts/ci_artifacts.py store --commit "${{ inputs.release_commit }}" --name release-plan candidate/desktop-r1-release-plan.json candidate/desktop-r1-release-plan.sha256
      - name: Stop for exact Owner approval
        run: |
          echo "::notice title=Desktop R1 Owner approval required::source_run_id=${{ github.run_id }} commit=${{ inputs.release_commit }} tag=${{ inputs.release_tag }} plan_sha256=$(cut -d' ' -f1 candidate/desktop-r1-release-plan.sha256)"
