name: Desktop R1 Publish

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Approved Desktop R1 Signed Candidate Actions run id.
        required: true
        type: string
      release_plan_sha256:
        description: Exact approved desktop.release-plan.v3 SHA-256.
        required: true
        type: string
      release_commit:
        description: Exact approved public main commit.
        required: true
        type: string
      release_tag:
        description: Exact approved release tag.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-r1-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: desktop-r1-publish-approved-artifacts
    if: github.ref == 'refs/heads/main'
    environment: desktop-production-publish
    runs-on: [self-hosted, installer-control]
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Verify source run and current main identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "${{ inputs.source_run_id }}" -gt 0
          test "$(git rev-parse HEAD)" = "${{ inputs.release_commit }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.release_commit }}"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.source_run_id }}")"
          test "$(jq -r .name <<<"$run_json")" = "Desktop R1 Signed Candidate"
          test "$(jq -r .head_sha <<<"$run_json")" = "${{ inputs.release_commit }}"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .event <<<"$run_json")" = workflow_dispatch
      - name: Read approved local plan and exact source-run candidate records
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          attempt="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.source_run_id }}" --jq .run_attempt)"
          root="${BIZHUB_CI_RECORDS_ROOT:-$HOME/.local/share/bizhub-installer/ci-records}"
          source="$root/${{ inputs.release_commit }}/${{ inputs.source_run_id }}-$attempt/release-plan"
          mkdir -p approved/plan
          cp "$source/desktop-r1-release-plan.json" "$source/desktop-r1-release-plan.sha256" approved/plan/
          plan=approved/plan/desktop-r1-release-plan.json
          test "$(shasum -a 256 "$plan" | cut -d' ' -f1)" = "${{ inputs.release_plan_sha256 }}"
          test "$(cut -d' ' -f1 approved/plan/desktop-r1-release-plan.sha256)" = "${{ inputs.release_plan_sha256 }}"
          test "$(jq -r .source_run.attempt "$plan")" = "$attempt"
          for platform in macos_arm64 windows_x64; do
            remote=()
            target=macos
            if [[ "$platform" == windows_x64 ]]; then remote=(--windows); target=windows; fi
            python3 scripts/ci_artifacts.py read \
              --commit "${{ inputs.release_commit }}" --run-id "${{ inputs.source_run_id }}" \
              --attempt "$(jq -r ".platforms.$platform.local_record.attempt" "$plan")" \
              --name "$(jq -r ".platforms.$platform.local_record.name" "$plan")" \
              --digest "$(jq -r ".platforms.$platform.local_record.digest" "$plan")" \
              --output "approved/$target" "${remote[@]}"
          done
          node desktop/scripts/release-plan.mjs verify \
            --plan "$plan" \
            --plan-sha256 "${{ inputs.release_plan_sha256 }}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --commit "${{ inputs.release_commit }}" \
            --tag "${{ inputs.release_tag }}" \
            --mac-root approved/macos \
            --windows-root approved/windows
      - name: Assert immutable-releases protection before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$(jq -r .enabled <<<"$immutable")" = true
      - name: Publish only the approved existing candidate files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          commit="${{ inputs.release_commit }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "desktop_release_already_exists:$tag" >&2; exit 1; fi
          version="$(jq -r .release.package_version approved/plan/desktop-r1-release-plan.json)"
          notes="$RUNNER_TEMP/desktop-release-notes.md"
          printf '%s\n' "BizHub Desktop $version" "" "Customer-neutral Desktop installer from approved commit $commit and release-plan SHA-256 ${{ inputs.release_plan_sha256 }}." > "$notes"
          prerelease=()
          if [[ "$tag" == *-preview.* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$commit" --title "BizHub Desktop $version" --notes-file "$notes" --draft "${prerelease[@]}"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            approved/macos/BizHub-Desktop-*-macOS-arm64.dmg \
            approved/macos/BizHub-Desktop-*-macOS-arm64.zip \
            approved/windows/BizHub-Desktop-Setup-x64.exe \
            approved/windows/*-full.nupkg \
            approved/windows/RELEASES \
            approved/macos/desktop-r1-macos-containers.json \
            approved/macos/desktop-r1-macos-release-identity.json \
            approved/macos/desktop-r1-macos-runtime-identity.json \
            approved/macos/desktop-r1-macos-upgrade-rollback.json \
            approved/windows/desktop-r1-windows-x64-identity.json \
            approved/windows/desktop-r1-windows-runtime-identity.json \
            approved/windows/desktop-r1-windows-upgrade-rollback.json \
            approved/plan/desktop-r1-release-plan.json \
            approved/plan/desktop-r1-release-plan.sha256
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Read back immutable release, tag, and all install bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.release_tag }}")"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .immutable <<<"$release")" = true
          test "$(jq -r .tag_name <<<"$release")" = "${{ inputs.release_tag }}"
          test "$(jq -r .target_commitish <<<"$release")" = "${{ inputs.release_commit }}"
          git fetch origin "refs/tags/${{ inputs.release_tag }}:refs/tags/${{ inputs.release_tag }}"
          test "$(git rev-list -n 1 "${{ inputs.release_tag }}")" = "${{ inputs.release_commit }}"
          mkdir published
          gh release download "${{ inputs.release_tag }}" --repo "$GITHUB_REPOSITORY" --dir published
          node desktop/scripts/release-plan.mjs verify \
            --plan published/desktop-r1-release-plan.json \
            --plan-sha256 "${{ inputs.release_plan_sha256 }}" \
            --source-run-id "${{ inputs.source_run_id }}" \
            --commit "${{ inputs.release_commit }}" \
            --tag "${{ inputs.release_tag }}" \
            --mac-root published \
            --windows-root published
