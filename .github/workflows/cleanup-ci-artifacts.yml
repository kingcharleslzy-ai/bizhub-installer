name: Clean local CI records

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-ci-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    strategy:
      matrix:
        runner: [installer-macos, installer-windows]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify existing Python 3.12 toolchain
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Remove expired complete local records
        run: python scripts/ci_artifacts.py prune
