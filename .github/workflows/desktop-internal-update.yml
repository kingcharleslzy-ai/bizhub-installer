name: Desktop Internal Update

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Short internal update notes
        required: false
        default: BizHub Desktop internal update
      publish:
        description: Publish the prerelease (main only); false builds and verifies signed artifacts only
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-internal-update
  cancel-in-progress: false

jobs:
  macos-arm64:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/desktop-signing/')
    environment: desktop-internal-signing
    runs-on: [self-hosted, installer-macos]
    outputs:
      record_digest: ${{ steps.store.outputs['record-digest'] }}
      record_attempt: ${{ steps.store.outputs['record-attempt'] }}
    timeout-minutes: 90
    env:
      BIZHUB_MACOS_SIGNING_MODE: production
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Verify existing Python 3.12 toolchain
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Test macOS arm64 source
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          python ../scripts/verify_checksums.py
          npm ci
          npm test
          npm run verify:boundary
          npm run audit:runtime
      - name: Require existing Developer ID publisher keychain
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.BIZHUB_MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.BIZHUB_MACOS_TEAM_ID }}
        run: |
          test -n "$SIGNING_IDENTITY" && test -n "$TEAM_ID"
          keychain="${BIZHUB_MACOS_KEYCHAIN:-$HOME/Library/Keychains/login.keychain-db}"
          # No P12/private key is materialized from secrets on a persistent host.
          if ! security find-identity -v -p codesigning "$keychain" | grep -F -- "$SIGNING_IDENTITY" >/dev/null; then
            echo '::error::desktop_macos_existing_keychain_identity_missing; signing credentials must be provisioned separately' >&2
            exit 1
          fi
          {
            echo "BIZHUB_MACOS_KEYCHAIN=$keychain"
            echo "BIZHUB_MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "BIZHUB_MACOS_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Prepare, sign, and rebind Runtime
        shell: bash
        run: |
          npm run prepare:runtime
          node scripts/prepare-signed-macos-runtime.mjs
      - name: Build, sign, and notarize application
        shell: bash
        env:
          BIZHUB_APPLE_ID: ${{ secrets.BIZHUB_APPLE_ID }}
          BIZHUB_APPLE_APP_PASSWORD: ${{ secrets.BIZHUB_APPLE_APP_PASSWORD }}
        run: |
          npm run make:macos-release
          node scripts/sign-production-macos-app.mjs
      - name: Verify signed application
        shell: bash
        run: |
          product="out/BizHub Desktop-darwin-arm64"
          app="$product/BizHub Desktop.app"
          resources="$app/Contents/Resources"
          npm run verify:artifact -- "$product" --expected-runtime-trust runtime-dist/generic-runtime-trust.json
          node scripts/verify-macos-release.mjs --app "$app" --expected-runtime-trust runtime-dist/generic-runtime-trust.json --mode production --team-id "$BIZHUB_MACOS_TEAM_ID"
          node scripts/account-flow-smoke.mjs --packaged-executable "$app/Contents/MacOS/BizHub Desktop" --packaged-trust-store "$resources/trusted-connection-keys.json" --packaged-account-directory "$resources/account-directory.json"
          node scripts/local-shell-smoke.mjs --packaged-executable "$app/Contents/MacOS/BizHub Desktop" --packaged-resources "$resources"
      - name: Create and verify notarized ZIP and DMG
        shell: bash
        env:
          BIZHUB_APPLE_ID: ${{ secrets.BIZHUB_APPLE_ID }}
          BIZHUB_APPLE_APP_PASSWORD: ${{ secrets.BIZHUB_APPLE_APP_PASSWORD }}
        run: |
          node scripts/make-macos-release-containers.mjs
          node scripts/verify-macos-release-containers.mjs
          version="$(node -p 'require("./package.json").version')"
          mkdir -p out/update
          cp "out/release/BizHub-Desktop-${version}-macOS-arm64.zip" "out/update/BizHub-Desktop-macOS-arm64-${version}.zip"
          cp "out/release/BizHub-Desktop-${version}-macOS-arm64.dmg" "out/update/BizHub-Desktop-macOS-arm64-${version}.dmg"
      - name: Preserve internal macos candidate locally
        id: store
        shell: bash
        run: python ../scripts/ci_artifacts.py store --name internal-macos "out/update/*"

  windows-x64:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/desktop-signing/')
    runs-on: [self-hosted, installer-windows]
    outputs:
      record_digest: ${{ steps.store.outputs['record-digest'] }}
      record_attempt: ${{ steps.store.outputs['record-attempt'] }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Preserve repository byte identity
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Verify existing Python 3.12 toolchain
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Test and build Windows x64
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ((node -p "process.platform") -ne "win32" -or (node -p "process.arch") -ne "x64") { throw "desktop_internal_update_target_invalid" }
          python ../scripts/verify_checksums.py
          npm ci
          npm test
          npm run verify:boundary
          npm run audit:runtime
          npm run make:windows
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force out/update | Out-Null
          Copy-Item "out/make/squirrel.windows/x64/BizHub-Desktop-Setup-x64.exe" "out/update/BizHub-Desktop-Setup-Windows-x64-$version.exe"
      - name: Preserve internal windows candidate locally
        id: store
        shell: pwsh
        run: python ../scripts/ci_artifacts.py store --name internal-windows "out/update/*"

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: [macos-arm64, windows-x64]
    runs-on: [self-hosted, installer-control]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
      - name: Read exact current-run local candidates
        shell: bash
        run: |
          python scripts/ci_artifacts.py read --name internal-macos --attempt "${{ needs.macos-arm64.outputs.record_attempt }}" --digest "${{ needs.macos-arm64.outputs.record_digest }}" --output candidates/macos
          python scripts/ci_artifacts.py read --name internal-windows --attempt "${{ needs.windows-x64.outputs.record_attempt }}" --digest "${{ needs.windows-x64.outputs.record_digest }}" --windows --output candidates/windows
          mkdir release-assets
          cp candidates/macos/*.zip candidates/macos/*.dmg candidates/windows/*.exe release-assets/
      - name: Create version-bound update manifest
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          version="$(node -p 'require("./desktop/package.json").version')"
          tag="desktop-v${version}-internal.${GITHUB_RUN_NUMBER}"
          macos="$(find release-assets -maxdepth 1 -type f -name '*.zip' -print -quit)"
          macos_dmg="$(find release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          windows="$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$macos" && test -n "$macos_dmg" && test -n "$windows"
          node desktop/scripts/make-update-manifest.mjs \
            --version "$version" \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "$tag" \
            --macos "$macos" \
            --windows "$windows" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes "$RELEASE_NOTES" \
            --output release-assets/desktop-update.json
          echo "DESKTOP_UPDATE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish internal Desktop prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          gh release create "$DESKTOP_UPDATE_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "BizHub Desktop $(node -p 'require("./desktop/package.json").version') Internal" \
            --notes "$RELEASE_NOTES" \
            release-assets/*.zip release-assets/*.dmg release-assets/*.exe release-assets/desktop-update.json
